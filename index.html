<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2b2117">
  <title>人情往来簿</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <!-- 书架页：左卡片 + 右侧可折叠总表 -->
  <div id="page-shelf" class="page active">
    <div class="topbar">
      <div class="topbar-title">
        <span class="seal-icon">礼</span>
        <h1>人情往来簿</h1>
      </div>
      <div class="topbar-actions">
        <button id="btn-search" class="icon-btn" title="搜索">&#128269;</button>
        <button id="btn-add-book" class="icon-btn" title="添加账本">&#43;</button>
        <button id="btn-settings" class="icon-btn" title="设置">&#9881;</button>
      </div>
    </div>
    <div class="shelf-body" id="shelf-body">
      <!-- 账本卡片（占满全宽） -->
      <div class="shelf-left" id="shelf-left">
        <div class="shelf-summary" id="shelf-summary"></div>
        <div class="shelf-grid" id="shelf-grid"></div>
        <div class="empty-hint" id="shelf-empty" style="display:none">
          <p>还没有账本</p><p>点击右上角 + 创建第一本</p>
        </div>
      </div>
      <!-- 右侧：总表（悬浮覆盖，不挤压卡片） -->
      <div class="shelf-right-toggle" id="shelf-right-toggle">&#171;</div>
      <div class="shelf-right-panel" id="shelf-right-panel">
        <div class="shelf-right-header">
          <span>总表</span>
          <button class="collapse-btn" id="btn-collapse-table">&#187;</button>
        </div>
        <div class="shelf-right-body">
          <table class="shelf-table">
            <thead><tr>
              <th>序号</th><th>姓名</th><th>礼金</th><th>事项</th>
              <th>页码</th><th>日期</th><th>收支</th><th>备注</th>
            </tr></thead>
            <tbody id="shelf-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 翻书页：单页模式（搜索栏+照片+表格） -->
  <div id="page-book" class="page">
    <div class="topbar">
      <button id="btn-book-back" class="icon-btn back-btn">&#8249;</button>
      <div class="search-input-wrap">
        <input type="text" id="book-search-input" placeholder="输入姓名搜索..." autocomplete="off">
        <button id="btn-book-search-clear" class="icon-btn" style="display:none">&times;</button>
      </div>
      <button id="btn-add-record" class="icon-btn" title="添加记录" style="flex-shrink:0">&#43;</button>
    </div>
    <div class="book-info-bar" id="book-info-bar">
      <div class="book-info-title" id="book-title"></div>
      <div class="book-info-date" id="book-date"></div>
      <div class="book-info-lunar" id="book-lunar"></div>
      <div class="book-nav">
        <button id="btn-prev-page" class="nav-btn">&#8249; 上一页</button>
        <span id="page-indicator"></span>
        <button id="btn-next-page" class="nav-btn">下一页 &#8250;</button>
      </div>
    </div>
    <div class="book-body" id="book-body">
      <div class="photo-single" id="photo-single">
        <div class="photo-label" id="photo-label"></div>
        <div class="photo-content" id="photo-content">暂无照片</div>
      </div>
      <div class="table-single">
        <table class="flip-table">
          <thead><tr>
            <th>序号</th><th>姓名</th><th>礼金</th><th>事项</th>
            <th>页码</th><th>日期</th><th>收支</th><th>备注</th>
          </tr></thead>
          <tbody id="flip-tbody"></tbody>
        </table>
        <div class="page-total" id="page-total"></div>
      </div>
    </div>
    <div class="book-total-bar" id="book-total"></div>
  </div>

  <!-- 搜索页 -->
  <div id="page-search" class="page">
    <div class="topbar">
      <button id="btn-search-back" class="icon-btn back-btn">&#8249;</button>
      <div class="search-input-wrap">
        <input type="text" id="search-input" placeholder="输入姓名搜索..." autocomplete="off">
        <button id="btn-search-clear" class="icon-btn" style="display:none">&times;</button>
      </div>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- 弹窗：添加/编辑账本 -->
  <div class="modal-overlay" id="modal-book" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-book-title">添加账本</h3>
        <button class="icon-btn modal-close" data-modal="modal-book">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>账本名称</label><input type="text" id="input-book-title" placeholder="如：结婚、满月酒、乔迁"></div>
        <div class="form-group"><label>事项类型</label><input type="text" id="input-book-category" placeholder="如：结婚、满月酒"></div>
        <div class="form-group"><label>日期</label><input type="text" id="input-book-date" placeholder="如：2024年01月15日"></div>
        <div class="form-group"><label>备注</label><input type="text" id="input-book-note" placeholder="备注（可选）"></div>
        <div class="form-group"><label>封面颜色</label><div class="cover-picker" id="cover-picker"></div></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-book-cancel">取消</button>
        <button class="btn btn-primary" id="btn-book-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：添加/编辑记录 -->
  <div class="modal-overlay" id="modal-record" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-record-title">添加记录</h3>
        <button class="icon-btn modal-close" data-modal="modal-record">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>姓名</label><input type="text" id="input-rec-name" placeholder="姓名"></div>
        <div class="form-group"><label>礼金</label><input type="number" id="input-rec-amount" placeholder="金额" step="0.01"></div>
        <div class="form-group"><label>收支</label>
          <div class="io-toggle">
            <button class="io-btn active" data-io="收入">收入</button>
            <button class="io-btn" data-io="支出">支出</button>
          </div>
        </div>
        <div class="form-group"><label>日期</label><input type="text" id="input-rec-date" placeholder="如：2024年01月15日"></div>
        <div class="form-group"><label>备注</label><input type="text" id="input-rec-note" placeholder="备注（可选）"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-rec-cancel">取消</button>
        <button class="btn btn-primary" id="btn-rec-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：设置 -->
  <div class="modal-overlay" id="modal-settings" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>&#x1F6E0; 设置</h3>
        <button class="icon-btn modal-close" data-modal="modal-settings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h4>&#x1F4E4; 数据同步</h4>
          <p class="settings-desc">与电脑版 MLT 同步数据（JSON 文件）</p>
          <div class="settings-btns">
            <button class="btn btn-cloud" id="btn-export-data">导出数据</button>
            <div class="file-btn-wrap">
              <span class="btn btn-cloud">导入数据</span>
              <input type="file" id="file-import"
                     accept=".json,application/json">
            </div>
            <button class="btn btn-cloud" id="btn-qr-scan">&#128247; 扫一扫导入</button>
          </div>
        </div>
        <div class="settings-section">
          <h4>&#x1F4CA; 每页行数</h4>
          <div class="settings-row">
            <label>翻书每页条数</label>
            <input type="number" id="input-rows-per-page" min="4" max="20" value="12">
          </div>
        </div>
        <div class="settings-section danger-section">
          <h4>&#x26A0; 危险操作</h4>
          <button class="btn btn-danger" id="btn-clear-all">清空所有数据</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btn-settings-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：扫一扫导入 -->
  <div class="modal-overlay" id="modal-qrscan" style="display:none">
    <div class="modal modal-qr">
      <div class="modal-header">
        <h3>&#128247; 扫一扫导入</h3>
        <button class="icon-btn" id="btn-qr-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="scan-stage">
          <video id="qr-video" playsinline muted></video>
          <canvas id="qr-canvas" style="display:none"></canvas>
          <div class="qr-cam-fail" id="qr-cam-fail" style="display:none"></div>
          <!-- 取景框装饰 -->
          <div class="scan-frame"><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="qr-progress-wrap">
          <div class="qr-progress-bar"><div id="qr-progress-fill"></div></div>
          <div id="qr-progress-text" class="qr-progress-text">尚未扫描</div>
        </div>
        <p id="qr-status" class="qr-status">将二维码对准取景框，自动连续扫描</p>
        <div class="qr-btns">
          <button class="btn btn-secondary" id="btn-qr-reset">重新扫描</button>
          <div class="file-btn-wrap">
            <span class="btn btn-cloud">&#128444; 相册选二维码</span>
            <input type="file" id="qr-file" accept="image/*" multiple>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗：记录操作 -->
  <div class="modal-overlay" id="modal-record-menu" style="display:none">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>记录操作</h3>
        <button class="icon-btn modal-close" data-modal="modal-record-menu">&times;</button>
      </div>
      <div class="modal-body menu-list">
        <button class="menu-item" id="menu-edit-record">&#x270F; 编辑</button>
        <button class="menu-item" id="menu-delete-record">&#x1F5D1; 删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  // 全局错误捕获（调试用）
  function _showError(prefix, msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:red;color:#fff;padding:8px;font-size:12px;z-index:9999;word-break:break-all;';
    d.textContent = prefix + msg;
    document.body.appendChild(d);
    setTimeout(function() { d.remove(); }, 6000);
  }
  window.onerror = function(msg, url, line) {
    _showError('JS错误: ', msg + ' @' + (url||'').split('/').pop() + ':' + line);
    return false;
  };
  window.addEventListener('unhandledrejection', function(e) {
    _showError('Promise错误: ', (e.reason && e.reason.message) ? e.reason.message : String(e.reason));
  });
  </script>
  <script type="module">
    // 拼音库本地 ESM → 桥接为全局 pinyinPro（module 自动延迟，早于用户操作）
    import { pinyin } from './vendor/pinyin-pro.mjs';
    window.pinyinPro = { pinyin: pinyin };
  </script>
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/pako.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/model.js"></script>
  <script src="js/pinyin.js"></script>
  <script src="js/shelf.js"></script>
  <script src="js/book.js"></script>
  <script src="js/search.js"></script>
  <script src="js/io.js"></script>
  <script src="js/qrscan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
